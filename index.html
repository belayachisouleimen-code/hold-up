<style>
/* Layout: une seule colonne façon tapis de jeu — bandeau d'état collant, table des équipes, puis panneau d'action en bas. */
:root{
  --felt:#0e3b2c; --felt-deep:#082419; --felt-line:#1d5a44;
  --ink:#f2eedf; --ink-dim:#a9bdb2;
  --gold:#f4b938; --gold-ink:#2a1d00;
  --red:#e2553f; --ok:#5fd18a; --bad:#ff8a78;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--felt-deep)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--felt) 0%,var(--felt-deep) 75%) fixed,var(--felt-deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%}
main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 80px;display:grid;gap:14px}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:.5px;text-wrap:balance;margin:0}
h1{font-size:2.3rem;line-height:1}
h1 small{display:block;font-family:var(--body);font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
h2{font-size:1.25rem;line-height:1.15}
p{margin:0}
.dim{color:var(--ink-dim)}
.small{font-size:.85rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.panel{background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:14px;padding:16px;display:grid;gap:12px}
.panel.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:12px;padding:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt-deep)}
.status .pot{margin-left:auto;font-family:var(--display);color:var(--gold);font-size:1.1rem;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--felt-line);color:var(--ink-dim);white-space:nowrap}
.tag.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tag.red{border-color:var(--red);color:var(--bad)}
.chip{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--felt-deep),0 0 0 3px var(--gold);vertical-align:-.05em;margin-right:.35em}
.seats{display:grid;gap:6px}
.seat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid transparent}
.seat.turn{border-color:var(--gold);background:rgba(244,185,56,.10)}
.seat.out{opacity:.45}
.seat .nm{font-weight:800;min-width:0;overflow-wrap:anywhere}
.seat .st{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.seat .meta{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.seat .bet{font-size:.8rem;color:var(--gold);font-weight:700}
.big{font-size:1.45rem;font-weight:800;line-height:1.25;text-wrap:balance}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:12px;min-height:50px;padding:10px 14px;border:2px solid var(--gold);background:var(--gold);color:var(--gold-ink);touch-action:manipulation}
button.ghost{background:transparent;color:var(--ink);border-color:var(--felt-line)}
button.warn{background:transparent;color:var(--bad);border-color:var(--red)}
button.choice{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--felt-line);text-align:left}
button.choice[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.mini{min-height:40px;padding:6px 10px;font-size:.85rem}
input,select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--felt-line);background:rgba(0,0,0,.3);color:var(--ink)}
label{display:grid;gap:6px;font-weight:700}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.stepper output{text-align:center;font-family:var(--display);font-size:1.6rem;color:var(--gold);font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:700;font-size:.9rem;min-height:1.2em}
.notice{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(244,185,56,.08);border-radius:0 8px 8px 0}
.ok{color:var(--ok)} .ko{color:var(--bad)}
details summary{cursor:pointer;font-weight:800}
details ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.potline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--felt-line)}
.potline:first-child{border-top:0}
.rank{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--felt-line);font-weight:800}
.rank .n{font-family:var(--display);color:var(--gold);font-size:1.3rem}
.secret{text-align:center;padding:28px 16px}
.secret .display{font-size:1.9rem;color:var(--gold);overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.panel.enter{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

    {category:"Insolite",tease:"Un petit cube qui roule.",q:"Combien font deux faces opposées d’un dé classique additionnées ?",options:["6", "7", "8", "9"],answer:1,bonus:"Combien de points au total sur un dé ?",bonusOptions:["18", "20", "21", "24"],bonusAnswer:2},
    {category:"Insolite",tease:"Une pâte, une sauce tomate et une reine.",q:"Dans quelle ville est née la pizza Margherita ?",options:["Rome", "Naples", "Milan", "Turin"],answer:1,bonus:"À quelle reine doit-elle son nom ?",bonusOptions:["Marguerite de Savoie", "Marie-Antoinette", "Victoria", "Isabelle"],bonusAnswer:0},
    {category:"Insolite",tease:"Un paquet bien connu des soirées.",q:"Combien de cartes compte un jeu classique sans jokers ?",options:["32", "48", "52", "54"],answer:2,bonus:"Combien de couleurs (pique, cœur…) ?",bonusOptions:["2", "3", "4", "5"],bonusAnswer:2}
  ];
  const GREED_COST = 3;

  function shuffle(a, rng){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function err(msg){ const e = new Error(msg); e.rule = true; return e; }

  function createGame(o){
    const names = (o.names || []).map(s => String(s).trim()).filter(Boolean);
    if (names.length < 2 || names.length > 6) throw err('Il faut entre 2 et 6 équipes.');
    if (new Set(names.map(n => n.toLowerCase())).size !== names.length) throw err('Deux équipes portent le même nom.');
    const rng = o.rng || Math.random;
    const start = o.startChips ?? 30;
    return {
      v: 2, phase: 'setup',
      teams: names.map(name => ({ name, chips: start, out: false, folded: false, allIn: false, committed: 0, street: 0, acted: false, ver: -1, answer: null, greedy: false, bonusAnswer: null, greedPaid: 0 })),
      startChips: start, rounds: o.rounds ?? 8, round: 0, greedMode: o.greed !== false,
      sb: o.sb ?? 1, bb: o.bb ?? 2, dealer: -1, sbSeat: -1, bbSeat: -1,
      deck: shuffle(o.questions || BANK, rng), question: null,
      dead: 0, jackpot: 0, street: null, currentBet: 0, minRaise: 0, raiseVer: 0, toAct: -1,
      answerQueue: [], answerIdx: 0, result: null, final: null, log: []
    };
  }

  const inHand = t => !t.out;
  function seatsAfter(g, from){ const n = g.teams.length, r = []; for (let k = 1; k <= n; k++) r.push((from + k + n) % n); return r; }
  function nextSeat(g, from, pred){ for (const i of seatsAfter(g, from)) if (pred(g.teams[i], i)) return i; return -1; }
  function totalPot(g){ return g.teams.reduce((s, t) => s + t.committed, 0) + g.dead; }
  function bank(g){ return g.teams.reduce((s, t) => s + t.chips, 0) + totalPot(g) + g.jackpot; }

  function pay(t, v){ v = Math.max(0, Math.min(v, t.chips)); t.chips -= v; t.street += v; t.committed += v; if (t.chips === 0) t.allIn = true; return v; }

  function resetStreet(g, name){

    g.teams.forEach(t => { t.street = 0; t.acted = false; t.ver = -1; });

  function startRound(g){

    g.dealer = nextSeat(g, g.dealer < 0 ? g.teams.length - 1 : g.dealer, inHand);
    if (alive.length === 2){ g.sbSeat = g.dealer; g.bbSeat = nextSeat(g, g.dealer, inHand); }
    else { g.sbSeat = nextSeat(g, g.dealer, inHand); g.bbSeat = nextSeat(g, g.sbSeat, inHand); }

  function needsAct(g, t){ return !t.folded && !t.allIn && (!t.acted || t.street < g.currentBet); }
  function streetDone(g){

    if (free.length === 1 && free[0].street >= g.currentBet) return true;
    return !g.teams.some(t => needsAct(g, t));

  // Ouvre un tour d'enchères : 'pre' juste après l'annonce, 'post' après les réponses secrètes.
  function openStreet(g){

    if (streetDone(g)){ closeStreet(g); return; }
    const after = g.street === 'pre' ? g.bbSeat : g.dealer;
    g.toAct = nextSeat(g, after, t => needsAct(g, t));

  function legal(g){
    const t = g.teams[g.toAct];
    const owe = Math.max(0, g.currentBet - t.street);
    const maxTo = t.street + t.chips;

  function act(g, type, to){

    const i = g.toAct, t = g.teams[i], L = legal(g);
    if (type === 'allin'){
      if (L.callIsAllIn || !L.canRaise) { if (t.chips <= L.owe) type = 'call'; else throw err('Relance impossible : tu peux seulement suivre ou te coucher.'); }

    }
    if (type === 'fold'){ t.folded = true; g.log.push(`${t.name} se couche.`); }

    else if (type === 'raise'){

      if (!(to > g.currentBet)) throw err('La relance doit dépasser la mise en cours.');
      if (to > L.maxTo) throw err('Pas assez de jetons.');

      g.log.push(`${t.name} ${L.isBet ? 'mise' : 'relance à'} ${to}${t.allIn ? ' (tapis)' : ''}.`);

  function canGreed(g, i){ const t = g.teams[i]; return g.greedMode && !t.folded && t.chips >= GREED_COST; }

  function answerFor(g, i, a){

    if (t.answered) throw err('Réponse déjà verrouillée.');

    if (a.greedy){
      if (!canGreed(g, i)) throw err(`La gourmandise coûte ${GREED_COST} jetons.`);
      if (!(Number.isInteger(a.bonusAnswer) && a.bonusAnswer >= 0 && a.bonusAnswer < q.bonusOptions.length)) throw err('Choisis une réponse à la question liée.');
    }
    t.answer = a.answer; t.answered = true;
    if (a.greedy){
      t.chips -= GREED_COST; t.greedPaid = GREED_COST; g.dead += GREED_COST; t.greedy = true; t.bonusAnswer = a.bonusAnswer;

    }

  function pendingAnswers(g){ return g.answerQueue.filter(i => !g.teams[i].folded && !g.teams[i].answered); }
  function afterAnswer(g){
    g.answerIdx = g.answerQueue.filter(i => g.teams[i].answered || g.teams[i].folded).length;
    const left = g.teams.filter(x => !x.folded);
    if (left.length === 1){ awardUncontested(g, left[0]); return; }
    if (!pendingAnswers(g).length){ resetStreet(g, 'post'); openStreet(g); }
  }
  // Version « un seul téléphone » : la prochaine équipe dans l'ordre.
  function submitAnswer(g, a){
    if (g.phase !== 'answers') throw err('Ce n’est pas le moment de répondre.');
    answerFor(g, pendingAnswers(g)[0], a);
  }

  // L'hôte couche d'office une équipe absente (à son tour d'enchère, ou tant qu'elle n'a pas répondu).
  function abandon(g, i){
    const t = g.teams[i];
    if (g.phase === 'bet'){ if (g.toAct !== i) throw err('Ce n’est pas le tour de cette équipe.'); act(g, 'fold'); return; }
    if (g.phase === 'answers'){
      if (t.folded || t.answered || !g.answerQueue.includes(i)) throw err('Cette équipe a déjà répondu.');
      t.folded = true; g.log.push(`${t.name} abandonne la manche.`); afterAnswer(g); return;
    }
    throw err('Rien à abandonner maintenant.');
  }

  // Ce que tout le monde peut voir : pas de réponses (ni bonnes, ni données) avant l'abattage, pas de paquet de questions.
  function publicView(g){
    const v = JSON.parse(JSON.stringify(g));
    delete v.deck; v.log = v.log.slice(-8);
    const reveal = g.phase === 'end' || (g.phase === 'result' && g.result && g.result.type === 'showdown');
    if (v.question){
      const q = v.question;

    if (!reveal) v.teams.forEach(t => { t.answer = null; t.bonusAnswer = null; t.greedy = false; t.greedPaid = 0; });

  function isCorrect(g, t){ const q = g.question; return t.answer === q.answer && (!t.greedy || t.bonusAnswer === q.bonusAnswer); }

  function distribute(g, winners, amount){
    if (!winners.length || amount <= 0) return [];
    const order = seatsAfter(g, g.dealer).filter(i => winners.includes(i));
    const share = Math.floor(amount / order.length), rem = amount % order.length;

  function awardUncontested(g, w){
    const total = totalPot(g), seat = g.teams.indexOf(w);

  // Pots principaux et annexes à partir des contributions totales de la manche.
  function buildPots(g){
    const contenders = g.teams.map((t, i) => i).filter(i => !g.teams[i].folded);
    const levels = [...new Set(contenders.map(i => g.teams[i].committed))].filter(v => v > 0).sort((a, b) => a - b);
    const pots = []; let prev = 0;
    levels.forEach((L, k) => {

      g.teams.forEach((t, i) => { const c = Math.min(t.committed, L) - Math.min(t.committed, prev); if (c > 0){ amount += c; from.add(i); } });
      if (k === levels.length - 1) g.teams.forEach((t, i) => { const extra = t.committed - L; if (extra > 0){ amount += extra; from.add(i); } });
      pots.push({ amount, eligible: contenders.filter(i => g.teams[i].committed >= L), from: [...from], dead: 0 });
      prev = L;
    });
    if (g.dead > 0){
      if (!pots.length) pots.push({ amount: 0, eligible: contenders, from: [], dead: 0 });
      pots[0].amount += g.dead; pots[0].dead = g.dead;
    }

  }

  function showdown(g){
    const pots = buildPots(g);
    const out = pots.map((p, k) => {
      const solo = p.eligible.length === 1 && p.dead === 0 && p.from.every(i => i === p.eligible[0]);
      if (solo) return { k, amount: p.amount, eligible: p.eligible, kind: 'refund', paid: distribute(g, p.eligible, p.amount) };
      const right = p.eligible.filter(i => isCorrect(g, g.teams[i]));

    let shared = [];

      const withChips = g.teams.map((t, i) => i).filter(i => g.teams[i].chips > 0);
      const to = withChips.length ? withChips : g.teams.map((t, i) => i);

      shared = distribute(g, to, amt);

      <label>Équipes (2 à 6, séparées par des virgules)<input id="names" value="${esc(ui.names || 'Les Renards, Les Pirates, Les Insolents')}" autocomplete="off"></label>
      <div class="row">
        <label>Manches<select id="rounds">${[6, 8, 10, 12].map(n => `<option ${n === (ui.rounds || 8) ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label>Jetons de départ<select id="start">${[20, 30, 50].map(n => `<option ${n === (ui.start || 30) ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      </div>
      <label>Gourmandise<select id="greed"><option value="yes">Activée (+${HoldUp.GREED_COST} jetons, question liée)</option><option value="no">Désactivée</option></select></label>
      ${errBox()}
      <button data-a="create">Créer la table</button>
      <p class="dim small">Blindes 1 / 2 tournantes. Un seul téléphone circule autour de la table. Jetons fictifs uniquement : aucun argent réel.</p>
    </section>
    <section class="panel"><details><summary>Les règles en 30 secondes</summary><ul class="small">
      <li>L’annonce donne le thème. Premier tour d’enchères : se coucher, suivre, relancer ou tapis.</li>
      <li>Chaque équipe restante répond en secret. Option gourmandise : ${HoldUp.GREED_COST} jetons pour une question liée.</li>
      <li>Second tour d’enchères, la question est connue de tous mais pas les réponses.</li>
      <li>Si tout le monde se couche, la dernière équipe gagne sans montrer sa réponse.</li>
      <li>Sinon on révèle : le pot va aux bonnes réponses. La gourmandise réussie passe devant, la gourmandise ratée élimine du pot.</li>
      <li>Une équipe à tapis ne peut gagner que ce qu’elle a couvert (pots annexes).</li>
      <li>Personne n’a trouvé ? Le pot devient jackpot pour la manche suivante.</li>
    </ul></details></section>`;
  }

  function teaseScreen(){
    const q = g.question;
    return header() + status() + `<section class="panel enter"><span class="label">L’annonce · ${esc(q.category)}</span><p class="big">${esc(q.tease)}</p>
      <p class="dim small">${esc(g.teams[g.sbSeat].name)} pose la petite blinde (${g.sb}), ${esc(g.teams[g.bbSeat].name)} la grosse (${g.bb}).${g.dead ? ` Jackpot en jeu : ${g.dead} jetons.` : ''}</p>
      <button data-a="open" data-focus>Ouvrir les enchères</button></section>` + seats();
  }

  function betScreen(){
    const t = g.teams[g.toAct], L = HoldUp.legal(g), q = g.question;
    if (ui.raiseFor !== `${g.round}-${g.street}-${g.toAct}-${g.currentBet}`){ ui.raiseFor = `${g.round}-${g.street}-${g.toAct}-${g.currentBet}`; ui.raiseTo = L.minTo; }
    ui.raiseTo = Math.max(L.minTo, Math.min(L.maxTo, ui.raiseTo));
    const potTo = Math.min(L.maxTo, g.currentBet + HoldUp.totalPot(g) + L.owe);
    const raisePanel = L.canRaise ? `
      <div class="stack"><span class="label">${L.isBet ? 'Miser' : 'Relancer'} à</span>
        <div class="stepper"><button class="ghost" data-a="dec" aria-label="Moins">−</button><output>${ui.raiseTo}</output><button class="ghost" data-a="inc" aria-label="Plus">+</button></div>
        <div class="row"><button class="ghost mini" data-a="set" data-v="${L.minTo}">Min ${L.minTo}</button>${potTo > L.minTo && potTo < L.maxTo ? `<button class="ghost mini" data-a="set" data-v="${potTo}">Pot ${potTo}</button>` : ''}<button class="ghost mini" data-a="set" data-v="${L.maxTo}">Tapis ${L.maxTo}</button></div>
        <button data-a="raise">${ui.raiseTo === L.maxTo ? 'Tapis' : (L.isBet ? 'Miser ' : 'Relancer à ') + ui.raiseTo}</button></div>` : '';
    const callBtn = L.canCheck ? `<button class="ghost" data-a="check" data-focus>Parole</button>` : `<button class="ghost" data-a="call" data-focus>${L.callIsAllIn ? 'Suivre à tapis' : 'Suivre'} ${L.callAmt}</button>`;
    const context = g.street === 'pre'
      ? `<span class="label">Avant la question · ${esc(q.category)}</span><p>${esc(q.tease)}</p>`
      : `<span class="label">Après les réponses secrètes</span><p><b>${esc(q.q)}</b></p>`;
    return header() + status(`<span class="tag">${g.street === 'pre' ? 'Enchères 1' : 'Enchères 2'}</span>`) + `
      <section class="panel hot enter">${context}
        <h2>À ${esc(t.name)} de parler</h2>
        <p class="dim small">${L.owe ? `Mise à suivre : ${L.owe}` : 'Personne n’a misé sur ce tour'} · reste ${t.chips} jetons</p>
        <div class="row"><button class="warn" data-a="fold">Se coucher</button>${callBtn}</div>
        ${raisePanel}${errBox()}${undoBtn()}
      </section>` + seats();
  }

  function answersScreen(){
    const i = g.answerQueue[g.answerIdx], t = g.teams[i], q = g.question;
    const key = `${g.round}-${i}`;
    if (ui.ansKey !== key){ ui.ansKey = key; ui.step = 'handoff'; ui.answer = null; ui.bonus = null; }
    const opts = (list, sel, a) => `<div class="stack">${list.map((x, j) => `<button class="choice" aria-pressed="${sel === j}" data-a="${a}" data-v="${j}">${'ABCD'[j]}. ${esc(x)}</button>`).join('')}</div>`;
    const top = header() + status(`<span class="tag">Réponses secrètes ${g.answerIdx + 1}/${g.answerQueue.length}</span>`);
    if (ui.step === 'handoff') return top + `<section class="panel secret enter"><span class="label">Passe le téléphone à</span><p class="display">${esc(t.name)}</p><p class="dim">Les autres regardent ailleurs.</p><button data-a="ready" data-focus>C’est nous, on regarde</button></section>${undoBtn()}`;
    if (ui.step === 'main') return top + `<section class="panel enter"><span class="label">${esc(t.name)} · réponse secrète</span><p class="big">${esc(q.q)}</p>${opts(q.options, ui.answer, 'pick')}${errBox()}<button data-a="lock" ${ui.answer === null ? 'disabled' : ''}>Verrouiller</button></section>`;
    if (ui.step === 'greed') return top + `<section class="panel hot enter"><span class="label">Gourmandise</span><h2>On tente le gros coup ?</h2><p>${HoldUp.GREED_COST} jetons pour une question liée. Les deux bonnes réponses vous donnent la priorité sur le pot. Une erreur sur la question liée vous en exclut.</p><p class="dim small">Il vous reste ${t.chips} jetons.</p><div class="row"><button class="ghost" data-a="nogreed" data-focus>Non merci</button><button data-a="greed">Je suis gourmand</button></div></section>`;
    if (ui.step === 'bonus') return top + `<section class="panel hot enter"><span class="label">${esc(t.name)} · question liée</span><p class="big">${esc(q.bonus)}</p>${opts(q.bonusOptions, ui.bonus, 'pickb')}${errBox()}<button data-a="lockb" ${ui.bonus === null ? 'disabled' : ''}>Verrouiller</button></section>`;
  }

  function resultScreen(){
    const r = g.result, q = g.question, last = g.round >= g.rounds || g.teams.filter(t => t.chips > 0).length < 2;
    let body;
    if (r.type === 'hidden'){
      body = `<span class="label">Aucun aveu</span><h2>${esc(g.teams[r.winner].name)} rafle ${r.total} jetons</h2><p class="dim">${r.street === 'pre' ? 'Tout le monde s’est couché avant la question.' : 'Les autres se sont couchés : la réponse reste secrète.'}</p>`;
    } else {
      const name = i => esc(g.teams[i].name);
      const pots = r.pots.map((p, k) => {
        const title = r.pots.length > 1 ? (k === 0 ? 'Pot principal' : `Pot annexe ${k}`) : 'Pot';
        const what = p.kind === 'rollover' ? '<span class="ko">Personne : jackpot reporté</span>'
          : p.kind === 'refund' ? `Rendu à ${name(p.eligible[0])} (mise non suivie)`
          : p.paid.map(x => `${name(x.seat)} +${x.amount}`).join(', ') + (p.kind === 'greed' ? ' · gourmandise' : '');
        return `<div class="potline"><span>${title}</span><b>${p.amount}</b><span class="small" style="grid-column:1/-1">${what}</span></div>`;
      }).join('');
      const answers = g.teams.filter(t => !t.folded).map(t => `<p class="small">${esc(t.name)} : ${esc(q.options[t.answer])} <span class="${t.answer === q.answer ? 'ok' : 'ko'}">${t.answer === q.answer ? '✓' : '✗'}</span>${t.greedy ? ` · liée : ${esc(q.bonusOptions[t.bonusAnswer])} <span class="${t.bonusAnswer === q.bonusAnswer ? 'ok' : 'ko'}">${t.bonusAnswer === q.bonusAnswer ? '✓' : '✗'}</span>` : ''}</p>`).join('');
      body = `<span class="label">Abattage</span><p class="big">${esc(q.q)}</p><p>Réponse : <b>${esc(q.options[q.answer])}</b>${g.teams.some(t => !t.folded && t.greedy) ? ` · liée : <b>${esc(q.bonusOptions[q.bonusAnswer])}</b>` : ''}</p>${answers}<div>${pots}</div>${g.jackpot && last ? '<p class="notice small">Dernière manche : le jackpot sera partagé entre les équipes qui ont encore des jetons.</p>' : ''}`;
    }
    return header() + status() + `<section class="panel enter">${body}<button data-a="next" data-focus>${last ? 'Classement final' : 'Manche suivante'}</button></section>` + seats();
  }

  function endScreen(){
    const ranked = g.teams.map((t, i) => ({ t, i })).sort((a, b) => b.t.chips - a.t.chips);
    const shared = g.final && g.final.jackpotShared.length ? `<p class="notice small">Jackpot non réclamé partagé : ${g.final.jackpotShared.map(x => `${esc(g.teams[x.seat].name)} +${x.amount}`).join(', ')}.</p>` : '';
    return header() + `<section class="panel enter"><span class="label">Fin de la soirée</span><h2>${esc(ranked[0].t.name)} gagne la table</h2><div>${ranked.map((x, k) => `<div class="rank"><span class="n">${k + 1}</span><span>${esc(x.t.name)}</span><span>${chips(x.t.chips)}</span></div>`).join('')}</div>${shared}<button data-a="new" data-focus>Nouvelle soirée</button></section>`;
  }

  app.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
    const a = b.dataset.a, v = Number(b.dataset.v);
    if (a === 'create'){
      ui.names = document.getElementById('names').value; ui.rounds = +document.getElementById('rounds').value; ui.start = +document.getElementById('start').value;
      return run(() => { g = HoldUp.createGame({ names: ui.names.split(','), rounds: ui.rounds, startChips: ui.start, greed: document.getElementById('greed').value === 'yes' }); history = []; HoldUp.startRound(g); });
    }
    if (a === 'resume'){ const s = loadSaved(); if (s){ g = s.g; history = s.history || []; } return render(); }
    if (a === 'discard' || a === 'new'){ clearSaved(); g = null; history = []; error = ''; return render(); }
    if (a === 'undo'){ if (history.length){ g = JSON.parse(history.pop()); ui = { names: ui.names, rounds: ui.rounds, start: ui.start }; error = ''; save(); } return render(); }
    if (a === 'open'){ snapshot(); return run(() => HoldUp.openStreet(g)); }
    if (['fold', 'check', 'call'].includes(a)){ snapshot(); return run(() => HoldUp.act(g, a)); }
    if (a === 'raise'){ snapshot(); return run(() => HoldUp.act(g, 'raise', ui.raiseTo)); }
    if (a === 'inc' || a === 'dec'){ ui.raiseTo += a === 'inc' ? 1 : -1; error = ''; return render(); }
    if (a === 'set'){ ui.raiseTo = v; error = ''; return render(); }
    if (a === 'ready'){ ui.step = 'main'; return render(); }
    if (a === 'pick'){ ui.answer = v; return render(); }
    if (a === 'pickb'){ ui.bonus = v; return render(); }
    const i = g && g.answerQueue[g.answerIdx];
    if (a === 'lock'){ if (HoldUp.canGreed(g, i)){ ui.step = 'greed'; return render(); } snapshot(); return run(() => HoldUp.submitAnswer(g, { answer: ui.answer })); }
    if (a === 'nogreed'){ snapshot(); return run(() => HoldUp.submitAnswer(g, { answer: ui.answer })); }
    if (a === 'greed'){ ui.step = 'bonus'; return render(); }
    if (a === 'lockb'){ snapshot(); return run(() => HoldUp.submitAnswer(g, { answer: ui.answer, greedy: true, bonusAnswer: ui.bonus })); }
    if (a === 'next'){ snapshot(); return run(() => HoldUp.startRound(g)); }
  });

  render();
})();
</script>
